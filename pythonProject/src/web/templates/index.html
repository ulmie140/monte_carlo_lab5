<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Монте-Карло: Оптимизация контроля</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen font-sans">
    <div class="max-w-6xl mx-auto p-6">
        <h1 class="text-3xl font-bold mb-8 text-center text-blue-400">Оптимизация входного контроля</h1>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Панель управления -->
            <div class="bg-gray-800 p-6 rounded-xl shadow-lg h-fit border border-gray-700">
                <h2 class="text-xl font-semibold mb-6 text-gray-200 border-b border-gray-700 pb-2">Параметры</h2>

                <form id="simForm" class="space-y-4">
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Доля брака A (%):</label>
                        <input type="number" id="inputA" value="5" class="w-full bg-gray-700 rounded p-2 text-white border border-gray-600 focus:border-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Стоимость контроля B:</label>
                        <input type="number" id="inputB" value="2" class="w-full bg-gray-700 rounded p-2 text-white border border-gray-600 focus:border-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Стоимость подгонки C:</label>
                        <input type="number" id="inputC" value="50" class="w-full bg-gray-700 rounded p-2 text-white border border-gray-600 focus:border-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Стоимость замены D:</label>
                        <input type="number" id="inputD" value="150" class="w-full bg-gray-700 rounded p-2 text-white border border-gray-600 focus:border-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Кол-во партий (N):</label>
                        <input type="number" id="inputN" value="10000" class="w-full bg-gray-700 rounded p-2 text-white border border-gray-600 focus:border-blue-500 focus:outline-none">
                    </div>
                    <button type="submit" id="submitBtn" class="w-full mt-4 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded transition duration-200">
                        Запустить симуляцию
                    </button>
                </form>
            </div>

            <!-- Результаты и график -->
            <div class="col-span-1 md:col-span-2 flex flex-col space-y-6">
                <!-- Плашка с результатом -->
                <div class="bg-gray-800 p-6 rounded-xl shadow-lg flex items-center justify-between border border-gray-700">
                    <div>
                        <h3 class="text-gray-400 text-sm font-semibold uppercase tracking-wider">Оптимальный контроль</h3>
                        <p id="resPercent" class="text-4xl font-bold text-teal-400 mt-1">-- %</p>
                    </div>
                    <div class="text-right">
                        <h3 class="text-gray-400 text-sm font-semibold uppercase tracking-wider">Минимальные затраты</h3>
                        <p id="resCost" class="text-3xl font-bold text-white mt-1">-- руб.</p>
                    </div>
                </div>

                <!-- График -->
                <div class="bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700 flex-grow">
                    <canvas id="resultChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        let myChart = null;

        document.getElementById('simForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.textContent = 'Вычисление...';
            btn.disabled = true;

            const data = {
                a: document.getElementById('inputA').value,
                b: document.getElementById('inputB').value,
                c: document.getElementById('inputC').value,
                d: document.getElementById('inputD').value,
                n: document.getElementById('inputN').value
            };

            try {
                const response = await fetch('/api/simulate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if(result.error) {
                    alert('Ошибка: ' + result.error);
                    return;
                }

                // Обновляем текст
                document.getElementById('resPercent').textContent = result.optimal_percent + ' %';
                document.getElementById('resCost').textContent = result.min_cost.toLocaleString('ru-RU') + ' руб.';

                // Отрисовка графика
                drawChart(result.percentages, result.costs, result.optimal_percent);

            } catch (error) {
                alert('Произошла ошибка при обращении к серверу.');
            } finally {
                btn.textContent = 'Запустить симуляцию';
                btn.disabled = false;
            }
        });

        function drawChart(labels, data, optimal) {
            const ctx = document.getElementById('resultChart').getContext('2d');

            if (myChart) {
                myChart.destroy(); // Удаляем старый график перед отрисовкой нового
            }

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Затраты (руб.)',
                        data: data,
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        borderWidth: 3,
                        pointBackgroundColor: '#fff',
                        pointRadius: 4,
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false },
                        tooltip: { mode: 'index', intersect: false }
                    },
                    scales: {
                        x: {
                            title: { display: true, text: 'Доля контроля (%)', color: '#9ca3af' },
                            ticks: { color: '#9ca3af' },
                            grid: { color: '#374151' }
                        },
                        y: {
                            title: { display: true, text: 'Суммарные затраты', color: '#9ca3af' },
                            ticks: { color: '#9ca3af' },
                            grid: { color: '#374151' }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
